<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hard Call — coaching off vs on</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C1F24'/%3E%3Cpath d='M14 13h7v38h-7z' fill='%23C79C5A'/%3E%3Cpath d='M14 13h36l-9 12.5 9 12.5H14z' fill='%23C79C5A'/%3E%3C/svg%3E">
<style>
  /* Offline by construction: no font link, no CDN, no fetch, no image file.
     The favicon above is a data URI so even that costs no request — the page
     is the whole artefact, and it is the fallback if the API is down. */

  /* The app's locked palette. Every value here is measured, not picked:
     ratios are in the comment beside each use. */
  :root{
    --page:#1c1f24;        /* the ground */
    --raised:#2b3038;      /* one step up — this is what does the ranking */
    --text:#f2eee7;        /* 14.30:1 on page, 11.48:1 on raised */
    --text-2:#9aa3ad;      /*  6.46:1 on page,  5.19:1 on raised */
    --gold:#c79c5a;        /*  6.56:1 on page,  5.26:1 on raised */
    --gold-hi:#dcb373;     /*  8.45:1 on page,  6.78:1 on raised */
    --on-gold:#1c1f24;     /*  6.56:1 on the gold fill */
    --ok:#9fc9a8;          /*  8.97:1 on page,  7.20:1 on raised */
    --bad:#e7a89b;         /*  8.24:1 on page,  6.61:1 on raised */
    --haz:#dcb373;         /* hazard fill,  6.78:1 on raised as a graphic */
    --haz-bar:#1c1f24;     /* hazard stripe, 8.45:1 against the fill */
    --line:rgba(154,163,173,.16);
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-back:cubic-bezier(.34,1.35,.64,1);
    /* A scale, not noise: seven steps, each a real jump. */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:40px;
    --r:4px; --r-card:14px;
  }
  /* Light ground. Every token re-measured against the new grounds rather than
     inverted by eye — a ratio that held on ink does not hold on cream. */
  @media (prefers-color-scheme: light){
    :root{
      --page:#f2eee7;
      --raised:#e9e4da;
      --text:#1c1f24;          /* 14.30:1 on page, 13.04:1 on raised */
      --text-2:rgba(28,31,36,.78); /* 7.35:1 on page, 7.00:1 on raised */
      --gold:#7a5214;          /*  5.97:1 on page,  5.45:1 on raised */
      --gold-hi:#7a5214;
      --ok:#2f6b3d;            /*  5.52:1 on page,  5.03:1 on raised */
      --bad:#a8362f;           /*  5.62:1 on page,  5.13:1 on raised */
      --haz:#8a5e1c;           /*  4.91:1 against its own stripe */
      --haz-bar:#f2eee7;
      --line:rgba(28,31,36,.16);
    }
  }

  *{box-sizing:border-box}
  html{color-scheme:dark light}
  body{
    margin:0;background:var(--page);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding:var(--s5) var(--s4) var(--s7);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto}

  /* ── masthead ─────────────────────────────────────────────── */
  .mast{margin-bottom:var(--s5)}
  h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.012em;font-weight:600}
  .sub{color:var(--text-2);font-size:13px;margin:var(--s1) 0 0;max-width:62ch}

  /* ── controls ─────────────────────────────────────────────── */
  .controls{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s5)}
  button{
    font:inherit;font-size:14px;font-weight:600;padding:10px var(--s4);
    border-radius:var(--r);cursor:pointer;border:0;
    background:var(--raised);color:var(--text);
    transition:transform .18s var(--ease-out),background .18s var(--ease-out);
  }
  button:hover:not(:disabled){background:var(--page);box-shadow:inset 0 0 0 1px var(--line)}
  button:active:not(:disabled){transform:translateY(1px)}
  button.primary{background:var(--gold-hi);color:var(--on-gold)}
  button.primary:hover:not(:disabled){background:var(--gold);box-shadow:none}
  button:disabled{opacity:.4;cursor:default}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:var(--r)}

  /* Segmented speed control — a designed control, not a native select. */
  .speed{display:flex;gap:2px;margin-left:auto;background:var(--raised);
    padding:3px;border-radius:var(--r)}
  .speed button{padding:6px 11px;font-size:12px;font-weight:600;background:transparent;
    color:var(--text-2);border-radius:2px}
  .speed button:hover:not(:disabled){background:transparent;box-shadow:none;color:var(--text)}
  .speed button[aria-pressed="true"]{background:var(--page);color:var(--text)}

  /* ── the verdict plate — the loudest thing, because the outcome is
        what this page exists to show. Identity lands the moment you press;
        the count lands once, true, when the run ends. ─────────────── */
  .plate{
    background:var(--raised);border-radius:var(--r-card);
    padding:var(--s5);margin-bottom:var(--s5);
    display:grid;gap:var(--s4);
  }
  .plate[hidden]{display:none}
  .run{display:flex;align-items:center;gap:var(--s3);
    font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .run .dot{width:var(--s2);height:var(--s2);border-radius:50%;background:var(--text-2);flex:none}
  .run.on{color:var(--gold-hi)} .run.on .dot{background:var(--gold-hi)}
  .run.off{color:var(--bad)}    .run.off .dot{background:var(--bad)}
  .tally{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
  .tally .n{font-size:52px;line-height:.9;font-weight:700;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums}
  .tally.miss .n{color:var(--bad)} .tally.done .n{color:var(--ok)}
  .tally .lab{font-size:17px;font-weight:600;max-width:30ch}
  .plate p{margin:0;font-size:14px;color:var(--text-2);max-width:78ch}
  .plate p b{color:var(--text);font-weight:600}
  .running{font-size:14px;color:var(--text-2);margin:0}

  /* ── the two columns ──────────────────────────────────────── */
  /* minmax(0,1fr), never a bare 1fr: a bare 1fr is minmax(auto,1fr) and a long
     unbroken line pushes the grid wider than the viewport. */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s5);align-items:start}
  @media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

  h2{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--text-2);
    margin:0 0 var(--s3);font-weight:700}

  /* The transcript is context, so it sits flat on the page ground.
     Ranking between regions is ground and air — not a box around each one. */
  .call{min-height:120px}
  .turn{margin:0 0 var(--s3);display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s3)}
  .who{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--text-2);padding-top:4px;font-weight:700}
  .who.cust{color:var(--gold)}
  .said{min-width:0;overflow-wrap:anywhere}
  .turn.cust .said{color:var(--text)}
  .turn.staff .said{color:var(--text-2)}
  .t{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:11px;margin-left:var(--s2)}
  .empty{color:var(--text-2);font-size:13px;margin:0}

  .diverge{display:flex;align-items:center;gap:var(--s3);margin:var(--s5) 0;
    color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .diverge::before,.diverge::after{content:"";flex:1;height:2px;background:var(--gold);opacity:.45}

  /* The worker's screen is the product's own output, so it is the one column
     that gets raised. */
  .screen{background:var(--raised);border-radius:var(--r-card);padding:var(--s4);min-height:140px}
  .flag{border-radius:var(--r);padding:var(--s3) var(--s3) var(--s3) var(--s4);
    margin-bottom:var(--s3);background:var(--page);
    box-shadow:inset 3px 0 0 var(--gold);
    animation:rise .34s var(--ease-back) both}
  .flag.req{box-shadow:inset 3px 0 0 var(--text-2)}
  /* Transform only. An entrance that animates opacity from 0 pins the element
     invisible when the tab is throttled and the animation never runs. */
  @keyframes rise{from{transform:translateY(10px)}to{transform:none}}
  .tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;
    font-weight:700;color:var(--gold-hi)}
  .tag.req{color:var(--text-2)}
  .flag h3{font-size:14px;margin:var(--s1) 0 var(--s1);line-height:1.35;font-weight:600}
  .flag p{margin:0;font-size:13px;color:var(--text-2)}
  .due{margin-top:var(--s3);font-size:14px;font-weight:700;color:var(--gold-hi);
    font-variant-numeric:tabular-nums}
  .auth{font-size:11px;color:var(--text-2);margin-top:var(--s2)}

  /* ── the report card: ONE continuous raised surface, not a stack of
        hairline-fenced rows. ───────────────────────────────────── */
  .card{margin-top:var(--s5);background:var(--raised);border-radius:var(--r-card);padding:var(--s4)}
  .row{display:grid;grid-template-columns:var(--s1) 96px minmax(0,1fr);gap:var(--s3);
    align-items:start;padding:var(--s3) 0}
  /* Status is carried three ways — texture, word and colour — so it survives
     greyscale and every kind of colour blindness. Colour is the last channel,
     never the only one. The stripe recipe is the app's own. */
  .mark{width:var(--s1);align-self:stretch;min-height:34px;border-radius:2px}
  .mark.missed{background-color:var(--haz);
    background-image:repeating-linear-gradient(45deg,var(--haz-bar) 0 2px,transparent 2px 6px)}
  .mark.satisfied{background:var(--ok)}
  .mark.unverified{background-color:var(--raised);
    background-image:repeating-linear-gradient(135deg,var(--text-2) 0 1px,transparent 1px 5px);
    box-shadow:inset 0 0 0 1px var(--line)}
  .word{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding-top:3px}
  .word.missed{color:var(--bad)} .word.satisfied{color:var(--ok)} .word.unverified{color:var(--text-2)}
  .row .body{min-width:0}
  .row .body b{display:block;font-size:14px;margin-bottom:var(--s1);font-weight:600;line-height:1.35}
  .row .body span{font-size:12px;color:var(--text-2)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important}
  }
  @media (max-width:520px){
    /* At 375 the caption eats the row and both rules shrink to nothing, which
       reads as a stray indent. Stack it: one rule, then the caption under it. */
    .diverge{display:grid;gap:var(--s2);text-align:center}
    .diverge::after{display:none}
    .diverge::before{width:100%;height:2px}
    .tally .n{font-size:42px}
    .plate{padding:var(--s4)}
    .row{grid-template-columns:var(--s1) minmax(0,1fr);row-gap:var(--s1)}
    .word{grid-column:2;padding-top:0}
    .row .body{grid-column:2}
    .turn{grid-template-columns:minmax(0,1fr);gap:var(--s1)}
    .who{padding-top:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>The Hard Call</h1>
    <p class="sub">The same call, twice. Identical up to 0:45, then the coaching fires. Nothing here touches the network.</p>
  </header>

  <div class="controls">
    <button id="off">Run without coaching</button>
    <button id="on" class="primary">Run with coaching</button>
    <div class="speed" role="group" aria-label="Playback speed">
      <button type="button" data-speed="4" aria-pressed="false">4&times;</button>
      <button type="button" data-speed="8" aria-pressed="true">8&times;</button>
      <button type="button" data-speed="1" aria-pressed="false">Real time</button>
    </div>
  </div>

  <section class="plate" id="plate" hidden aria-live="polite">
    <div class="run" id="run"><span class="dot"></span><span id="runLabel"></span></div>
    <p class="running" id="running">Playing the call.</p>
    <div class="tally" id="tally" hidden><span class="n" id="tallyN"></span><span class="lab" id="tallyLab"></span></div>
    <p id="verdict" hidden></p>
  </section>

  <div class="grid">
    <div>
      <div class="call">
        <h2>Call</h2>
        <div id="transcript"><p class="empty">Press a button to start.</p></div>
      </div>
      <div class="card" id="cardWrap" hidden>
        <h2>Report card</h2>
        <div id="card"></div>
      </div>
    </div>
    <div class="screen">
      <h2>On the worker's screen</h2>
      <div id="flags"><p class="empty">Nothing yet.</p></div>
    </div>
  </div>
</div>

<script>
const DATA = {"divergesAt":45000,"off":{"transcript":{"call_id":"call_003","scenario":"oral_notice_missed_by_staff","notes":"The demo call. Customer gives a clear oral hardship notice at ~52s. The staff member never recognises it, pivots straight to an informal payment arrangement, never mentions the hardship process, and closes with 'I'll put a note on the file' — which starts no clock and creates no record. This is the NAB/AFSH failure pattern in miniature. Detector MUST fire at the notice; the report card must mark the misses.","duration_ms":158700,"turns":[{"speaker":"staff","start_ms":0,"end_ms":4800,"text":"Meridian Home Loans, Jordan speaking. Name and property address please?"},{"speaker":"customer","start_ms":5200,"end_ms":11600,"text":"Mei Lam. It's 27 Ardwick Street, Sunshine West."},{"speaker":"staff","start_ms":12000,"end_ms":16100,"text":"Got it. I can see there's an arrears balance on the account. Are you calling about that?"},{"speaker":"customer","start_ms":16500,"end_ms":21300,"text":"Yes. I've missed the last two and I don't think I'm going to make the next one either."},{"speaker":"staff","start_ms":21700,"end_ms":25900,"text":"Okay. What's the plan to bring the account back up to date?"},{"speaker":"customer","start_ms":26300,"end_ms":39800,"text":"That's the thing, I don't really have one. I had surgery in July and I'm signed off work until at least February. I'm on the income protection but it's about sixty per cent of what I was on."},{"speaker":"staff","start_ms":40200,"end_ms":44600,"text":"Right. And is there anyone else contributing to the household?"},{"speaker":"customer","start_ms":45000,"end_ms":64200,"text":"No, it's just me. Look, I've done the numbers a dozen times. On sixty per cent I cannot cover the repayment. Not next month, not the month after. It's going to be like this until I'm cleared to go back, and that's four or five months away at best."},{"speaker":"staff","start_ms":64600,"end_ms":71200,"text":"Okay. What I can do is set up an arrangement where you pay what you can each month and we'll review it."},{"speaker":"customer","start_ms":71600,"end_ms":76400,"text":"What does that mean, though? Am I still behind? Does it still count against me?"},{"speaker":"staff","start_ms":76800,"end_ms":86300,"text":"The arrears stay on the account, yes, but as long as you're paying something each month it shows you're engaging with us."},{"speaker":"customer","start_ms":86700,"end_ms":94100,"text":"And the letters? I got one last week that mentioned legal action. Does that stop?"},{"speaker":"staff","start_ms":94500,"end_ms":102800,"text":"I can't guarantee that. The letters are automated from the system. I'd just call us if you get another one."},{"speaker":"customer","start_ms":103200,"end_ms":110600,"text":"Right. So is there anything else, like — I don't know, is there a process for this? A friend of mine said her bank did something when her husband got sick."},{"speaker":"staff","start_ms":111000,"end_ms":119400,"text":"There are options but they'd depend on your circumstances. For now the arrangement is the quickest thing to get in place."},{"speaker":"customer","start_ms":119800,"end_ms":124300,"text":"Okay. How much do I need to pay for the arrangement?"},{"speaker":"staff","start_ms":124700,"end_ms":132900,"text":"Whatever you can manage. Say four hundred a month? Then we'd look at it again in three months."},{"speaker":"customer","start_ms":133300,"end_ms":139800,"text":"I can probably do four hundred. I don't know what happens after three months though."},{"speaker":"staff","start_ms":140200,"end_ms":150100,"text":"We'll cross that bridge then. I'll put a note on the file that we've spoken and that you're on an informal arrangement."},{"speaker":"customer","start_ms":150500,"end_ms":154200,"text":"Alright. Thanks for your help."},{"speaker":"staff","start_ms":154600,"end_ms":158700,"text":"No problem. Anything else I can help with today?"}]},"flags":[{"flag_id":"f_003_01","call_id":"call_003","kind":"request","persist":true,"rule_id":"HARDSHIP_REQUEST","raised_at":{"speaker":"customer","start_ms":16500},"attribution":"known","obligation":"Customer has asked to change their repayments. Establish whether this is a timing problem or an inability to pay","deadline_days":null,"deadline_from":null,"followup_days":7,"authority":"National Credit Code s 72 (threshold question)","confidence":0.72,"staff_prompt":"Customer has asked to change their repayments. Ask whether they can recover in the near term — if not, this is a hardship notice and the 21-day clock starts.","superseded_by":"f_003_02","resolution":{"status":"missed","evidence":null,"reason":"The threshold question was never asked. Chase within 7 days: the 21-day clock runs from when the customer spoke, so acting by day 7 still leaves 14 days if this turns out to have been a hardship notice."}},{"flag_id":"f_003_02","call_id":"call_003","kind":"obligation","persist":true,"rule_id":"NCC_72_ORAL_NOTICE","raised_at":{"speaker":"customer","start_ms":45000},"attribution":"known","obligation":"Assess the hardship notice and notify the customer of the decision","deadline_days":21,"deadline_from":"notice_received","followup_days":null,"authority":"National Credit Code s 72(4)","confidence":0.95,"staff_prompt":"Hardship notice received. 21-day clock started. Tell the customer the hardship process exists and lodge it.","resolution":{"status":"missed","evidence":null,"reason":"The call ended and no staff turn discharged this obligation."}},{"flag_id":"f_003_03","call_id":"call_003","kind":"obligation","persist":true,"rule_id":"ABA_INFORM_HARDSHIP_PROVISIONS","raised_at":{"speaker":"customer","start_ms":45000},"attribution":"known","obligation":"Inform the customer that hardship provisions exist under the National Credit Code","deadline_days":null,"deadline_from":null,"followup_days":null,"authority":"ABA industry guideline — Banks' financial difficulty programs","confidence":0.95,"staff_prompt":"Tell the customer hardship provisions exist. Most customers do not know.","escalated_at":{"speaker":"customer","start_ms":103200},"resolution":{"status":"missed","evidence":null,"reason":"The call ended and no staff turn discharged this obligation."}}]},"on":{"transcript":{"call_id":"call_003c","scenario":"same_call_coached","notes":"The coached counterfactual to call_003. Every turn up to and including the customer's hardship notice at 45000ms is byte-identical to call_003 — same customer, same words. The coaching prompt fires at 45000, and from the worker's next turn the calls diverge, because she acted on it. That divergence IS the product. Detector must raise the same events at the same timestamps as call_003 and resolve them satisfied instead of missed.","diverges_at_ms":45000,"duration_ms":160800,"turns":[{"speaker":"staff","start_ms":0,"end_ms":4800,"text":"Meridian Home Loans, Jordan speaking. Name and property address please?"},{"speaker":"customer","start_ms":5200,"end_ms":11600,"text":"Mei Lam. It's 27 Ardwick Street, Sunshine West."},{"speaker":"staff","start_ms":12000,"end_ms":16100,"text":"Got it. I can see there's an arrears balance on the account. Are you calling about that?"},{"speaker":"customer","start_ms":16500,"end_ms":21300,"text":"Yes. I've missed the last two and I don't think I'm going to make the next one either."},{"speaker":"staff","start_ms":21700,"end_ms":25900,"text":"Okay. What's the plan to bring the account back up to date?"},{"speaker":"customer","start_ms":26300,"end_ms":39800,"text":"That's the thing, I don't really have one. I had surgery in July and I'm signed off work until at least February. I'm on the income protection but it's about sixty per cent of what I was on."},{"speaker":"staff","start_ms":40200,"end_ms":44600,"text":"Right. And is there anyone else contributing to the household?"},{"speaker":"customer","start_ms":45000,"end_ms":64200,"text":"No, it's just me. Look, I've done the numbers a dozen times. On sixty per cent I cannot cover the repayment. Not next month, not the month after. It's going to be like this until I'm cleared to go back, and that's four or five months away at best."},{"speaker":"staff","start_ms":64600,"end_ms":79200,"text":"Thank you for telling me. Mei, what you've just described counts as a hardship notice — that's a formal thing under the National Credit Code, and it means we have to look at changing your arrangements. I'm lodging it now while we're on the call."},{"speaker":"customer","start_ms":79600,"end_ms":84100,"text":"Oh. I didn't know that was something you could do."},{"speaker":"staff","start_ms":84500,"end_ms":97800,"text":"Most people don't. We've got twenty-one days from today to assess it and come back to you with a decision, and I'd expect it well before that."},{"speaker":"customer","start_ms":98200,"end_ms":104600,"text":"And the letters? I got one last week that mentioned legal action. Does that stop?"},{"speaker":"staff","start_ms":105000,"end_ms":116400,"text":"Yes. While a hardship application is open the collections activity pauses. I'm putting a hold on the account now so nothing automated goes out to you."},{"speaker":"customer","start_ms":116800,"end_ms":121300,"text":"Okay. That's a relief, honestly."},{"speaker":"staff","start_ms":121700,"end_ms":133900,"text":"There are a few things we can look at — pausing repayments for a period, or moving you to interest-only while you're off work. I'll need some information about income and expenses to work out which fits."},{"speaker":"customer","start_ms":134300,"end_ms":138600,"text":"I can get that together. How do I send it?"},{"speaker":"staff","start_ms":139000,"end_ms":151200,"text":"I'll email a form today. And Mei — if you'd rather not do this on your own, free financial counselling is available and they can deal with us on your behalf. No cost to you."},{"speaker":"customer","start_ms":151600,"end_ms":156000,"text":"I might take that. Thank you."},{"speaker":"staff","start_ms":156400,"end_ms":160800,"text":"That's what the call is for. I'll get that email out within the hour."}]},"flags":[{"flag_id":"f_003c_01","call_id":"call_003c","kind":"request","persist":true,"rule_id":"HARDSHIP_REQUEST","raised_at":{"speaker":"customer","start_ms":16500},"attribution":"known","obligation":"Customer has asked to change their repayments. Establish whether this is a timing problem or an inability to pay","deadline_days":null,"deadline_from":null,"followup_days":7,"authority":"National Credit Code s 72 (threshold question)","confidence":0.72,"staff_prompt":"Customer has asked to change their repayments. Ask whether they can recover in the near term — if not, this is a hardship notice and the 21-day clock starts.","superseded_by":"f_003c_02","resolution":{"status":"satisfied","evidence":{"speaker":"staff","start_ms":64600},"reason":"Staff discharged the obligation at 64600ms."}},{"flag_id":"f_003c_02","call_id":"call_003c","kind":"obligation","persist":true,"rule_id":"NCC_72_ORAL_NOTICE","raised_at":{"speaker":"customer","start_ms":45000},"attribution":"known","obligation":"Assess the hardship notice and notify the customer of the decision","deadline_days":21,"deadline_from":"notice_received","followup_days":null,"authority":"National Credit Code s 72(4)","confidence":0.95,"staff_prompt":"Hardship notice received. 21-day clock started. Tell the customer the hardship process exists and lodge it.","resolution":{"status":"satisfied","evidence":{"speaker":"staff","start_ms":64600},"reason":"Staff discharged the obligation at 64600ms."}},{"flag_id":"f_003c_03","call_id":"call_003c","kind":"obligation","persist":true,"rule_id":"ABA_INFORM_HARDSHIP_PROVISIONS","raised_at":{"speaker":"customer","start_ms":45000},"attribution":"known","obligation":"Inform the customer that hardship provisions exist under the National Credit Code","deadline_days":null,"deadline_from":null,"followup_days":null,"authority":"ABA industry guideline — Banks' financial difficulty programs","confidence":0.95,"staff_prompt":"Tell the customer hardship provisions exist. Most customers do not know.","resolution":{"status":"satisfied","evidence":{"speaker":"staff","start_ms":64600},"reason":"Staff discharged the obligation at 64600ms."}},{"flag_id":"f_003c_04","call_id":"call_003c","kind":"obligation","persist":true,"rule_id":"NCC_72_WRITTEN_NOTICE_30D","raised_at":{"speaker":"staff","start_ms":121700},"attribution":"known","obligation":"If a variation deferring or reducing obligations for more than 90 days is agreed, send written notice of the contract changes","deadline_days":30,"deadline_from":"variation_agreed","followup_days":null,"authority":"National Credit Code s 72 / s 73","confidence":0.64,"staff_prompt":"If a variation over 90 days is agreed, written notice is due within 30 days.","resolution":{"status":"unverified","evidence":null,"reason":"Discharged after the call by a system action, not by anything said on it. No in-call evidence can settle this."}}]}};
const SET = (coaching) => (coaching ? DATA.on : DATA.off);
const $ = (id) => document.getElementById(id);
let timer = null, run = 0, speed = 8;

const fmt = (ms) => {
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)) + ":" + String(s%60).padStart(2,"0");
};
const due = (days) => {
  if (days == null) return null;
  const d = new Date(); d.setDate(d.getDate()+days);
  return d.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});
};

document.querySelectorAll(".speed button").forEach((b) => {
  b.onclick = () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll(".speed button")
      .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  };
});

function reset() {
  run++;
  if (timer) { clearTimeout(timer); timer = null; }
  $("transcript").innerHTML = "";
  $("flags").innerHTML = '<p class="empty">Nothing yet.</p>';
  $("card").innerHTML = "";
  $("cardWrap").hidden = true;
  $("tally").hidden = true;
  $("verdict").hidden = true;
  $("running").hidden = false;
}

function addTurn(turn) {
  const el = document.createElement("div");
  const cust = turn.speaker === "customer";
  el.className = "turn " + (cust ? "cust" : "staff");
  el.innerHTML =
    '<div class="who ' + (cust ? "cust" : "") + '">' + (cust ? "Customer" : "Worker") + '</div>' +
    '<div class="said">' + turn.text.replace(/&/g,"&amp;").replace(/</g,"&lt;") +
    '<span class="t">' + fmt(turn.start_ms) + '</span></div>';
  $("transcript").appendChild(el);
  el.scrollIntoView({block:"nearest"});
}

function addFlag(f) {
  if ($("flags").querySelector(".empty")) $("flags").innerHTML = "";
  const isReq = f.kind === "request";
  const el = document.createElement("div");
  el.className = "flag" + (isReq ? " req" : "");
  const d = due(f.deadline_days);
  el.innerHTML =
    '<span class="tag' + (isReq ? " req" : "") + '">' +
      (isReq ? "Check this" : "Legal · clock started") + '</span>' +
    '<h3>' + f.obligation + '</h3>' +
    '<p>' + f.staff_prompt + '</p>' +
    (d ? '<div class="due">Decision due ' + d + ' · ' + f.deadline_days + ' days</div>' : '') +
    '<div class="auth">' + f.authority + ' · raised at ' + fmt(f.raised_at.start_ms) + '</div>';
  $("flags").appendChild(el);
}

function divider() {
  const el = document.createElement("div");
  el.className = "diverge";
  el.innerHTML = '<span>coaching fired here — everything above is identical in both runs</span>';
  $("transcript").appendChild(el);
}

function showCard(coaching) {
  const scored = SET(coaching).flags.filter(f => !f.superseded_by);
  $("card").innerHTML = scored.map(f => {
    const r = f.resolution || {};
    const ev = r.evidence ? " Evidence at " + fmt(r.evidence.start_ms) + "." : "";
    return '<div class="row">' +
      '<span class="mark ' + r.status + '" aria-hidden="true"></span>' +
      '<span class="word ' + r.status + '">' + r.status + '</span>' +
      '<div class="body"><b>' + f.obligation + '</b>' +
      '<span>' + f.authority + '. Raised at ' + fmt(f.raised_at.start_ms) + '.' + ev + '</span></div></div>';
  }).join("");
  $("cardWrap").hidden = false;

  const missed = scored.filter(f => (f.resolution||{}).status === "missed").length;
  const ok = scored.filter(f => (f.resolution||{}).status === "satisfied").length;

  // The count is written once, at its true value. Never counted up from zero:
  // a quantity that is wrong on the first frame is a quantity that lied.
  $("running").hidden = true;
  $("tally").hidden = false;
  $("tally").className = "tally " + (coaching ? "done" : "miss");
  $("tallyN").textContent = String(coaching ? ok : missed);
  $("tallyLab").textContent = coaching
    ? "obligations handled on the call"
    : "obligations missed";

  $("verdict").hidden = false;
  $("verdict").innerHTML = coaching
    ? '<b>With coaching — every duty that can be settled on the call was settled.</b> ' + ok + ' handled, and the written-notice duty is marked unverified because it is discharged after the call by a system action, not by anything said on it. The prompt fired at 0:45, the moment Mei said she could not cover the repayment for four or five months. The worker named the hardship process, started the clock on the record and paused collections. Up to 0:45 this is the same call as the other run, word for word.'
    : '<b>Without coaching — ' + missed + ' obligations missed.</b> Identical words from the customer, identical analysis underneath. The worker simply never saw it, and offered an informal arrangement instead, which starts no clock and leaves no record that a decision is owed. That is the failure ASIC penalised NAB and AFSH $15.5m for in August 2025, across 345 customers.';
}

async function play(coaching) {
  reset();
  const mine = run;
  $("plate").hidden = false;
  $("run").className = "run " + (coaching ? "on" : "off");
  $("runLabel").textContent = coaching ? "Coaching on" : "Coaching off";
  $("running").textContent = coaching
    ? "Playing the call. Prompts appear on the worker's screen as they fire."
    : "Playing the call. The same analysis is running; none of it reaches the worker.";
  $("on").disabled = $("off").disabled = true;

  const set = SET(coaching);
  const turns = set.transcript.turns;
  let clock = 0, i = 0, marked = false;

  const step = () => {
    if (mine !== run) return;
    if (i >= turns.length) {
      showCard(coaching);
      $("on").disabled = $("off").disabled = false;
      return;
    }
    const turn = turns[i];
    if (!marked && turn.start_ms > DATA.divergesAt) { divider(); marked = true; }
    addTurn(turn);
    if (coaching) {
      set.flags
        .filter(f => f.raised_at.start_ms === turn.start_ms)
        .forEach(addFlag);
    }
    clock = turn.start_ms;
    const next = i + 1 < turns.length ? turns[i+1].start_ms : clock + 800;
    i++;
    timer = setTimeout(step, Math.max(120, (next - clock) / speed));
  };
  step();
}

$("off").onclick = () => play(false);
$("on").onclick = () => play(true);
</script>
